[package]
name = "faucet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Testnet faucet for the mock tUSDT0: mints through the SAC-manager under MINTER_ROLE."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "=25.1.1" }
soroban-sdk-macros = "=25.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
