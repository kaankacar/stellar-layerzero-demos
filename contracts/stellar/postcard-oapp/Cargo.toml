[package]
name = "postcard-oapp"
version = "0.1.0"
edition = "2021"
publish = false
description = "A tiny LayerZero OApp on Stellar: sends and stores 140-byte postcards. Teaching contract for stellar-layerzero-demos."

[lib]
crate-type = ["cdylib"]
doctest = false

# Path dependencies are rewritten by scripts/build-wasm.sh to the vendored LayerZero crates.
[dependencies]
soroban-sdk = { version = "=25.1.1", features = ["hazmat-address", "hazmat-crypto"] }
soroban-sdk-macros = "=25.1.1"
endpoint-v2 = { path = "../../../.lz-build/vendor/endpoint-v2", default-features = false, features = ["library"] }
utils = { path = "../../../.lz-build/vendor/utils" }
common-macros = { path = "../../../.lz-build/vendor/common-macros" }
oapp = { path = "../../../.lz-build/vendor/oapp" }
oapp-macros = { path = "../../../.lz-build/vendor/oapp-macros" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
